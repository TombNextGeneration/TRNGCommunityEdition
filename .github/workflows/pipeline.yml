name: Pipeline
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - run: |
          msbuild /t:Rebuild /p:Configuration=Debug TRNGCommunityEdition.sln
      - uses: actions/upload-artifact@v4
        with:
          name: TRNGCE
          path: Debug/*
