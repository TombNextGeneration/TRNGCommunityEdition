name: Build Pipeline
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Configuration
        required: true
        type: choice
        options:
          - Debug
          - Release
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
      - run: |
          vcpkg integrate install
          msbuild /t:Rebuild /p:Configuration=Debug TRNGCommunityEdition.sln
      - uses: actions/upload-artifact@v7
        id: artifact
        with:
          name: TRNGCE
          path: Debug/*
      - run: |
          $version = (Get-Item -Path Debug\TRNGCE.dll).VersionInfo
          switch ('${{ inputs.configuration }}') {
              'Debug' {
                  curl -F "payload_json=$(@'
                  ${{ vars.BUILD_DEBUG_MESSAGE }}
          '@ -f "$($version.FileMajorPart).$($version.FileMinorPart).$($version.FileBuildPart)", '${{ github.ref_name }}', (git rev-parse --short HEAD), '${{ github.sha }}', '${{ steps.artifact.outputs.artifact-url }}')" -F file1=@Debug\TRNGCE.dll ${{ secrets.BUILD_DEBUG_WEBHOOK }}
              }
              'Release' {
                  curl -F "payload_json=$(@'
                  ${{ vars.BUILD_RELEASE_MESSAGE }}
          '@ -f "$($version.FileMajorPart).$($version.FileMinorPart).$($version.FileBuildPart)", (Get-Date -Format 'yyyy-MM-dd'), '${{ steps.artifact.outputs.artifact-url }}')" -F file1=@Debug\TRNGCE.dll ${{ secrets.BUILD_RELEASE_WEBHOOK }}
              }
          }
